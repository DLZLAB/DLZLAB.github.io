<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title data-i18n="title">Muharam — Dawood WaliZada</title>
<meta name="description" data-i18n="desc" content="Muharam-related images and resources by Dawood WaliZada." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://dlzlab.com/muharam/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter','Vazirmatn',system-ui,sans-serif;
  background:#0d0407;
  color:#f5e6d0;
  line-height:1.6;
  min-height:100vh;
  padding:2rem 1.5rem;
  background-image:radial-gradient(ellipse at 20% 50%, rgba(107,29,47,0.3) 0%, transparent 60%),
                   radial-gradient(ellipse at 80% 50%, rgba(212,160,67,0.08) 0%, transparent 60%);
}
.container{max-width:960px;width:100%;margin:0 auto}
.lang-bar{display:flex;justify-content:flex-end;margin-bottom:1rem}
.lang-btn{background:rgba(212,160,67,0.1);border:1px solid rgba(212,160,67,.15);color:#b8945a;padding:4px 14px;border-radius:20px;font-size:0.75rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.25s;text-transform:uppercase;letter-spacing:1px}
.lang-btn:hover{background:rgba(212,160,67,0.2);color:#d4a043}
html[dir="rtl"] body{font-family:'Vazirmatn','Inter',system-ui,sans-serif}
.header{text-align:center;margin-bottom:3rem}
.header .back{display:inline-flex;align-items:center;gap:0.4rem;color:#b8945a;font-size:0.85rem;text-decoration:none;margin-bottom:1rem;transition:color 0.2s}
.header .back:hover{color:#d4a043}
.header h1{font-size:2.8rem;font-weight:800;line-height:1.15;background:linear-gradient(135deg,#f5e6d0,#d4a043);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:#b8945a;font-size:1rem;margin-top:0.5rem}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.2rem;margin-bottom:3rem}
.gallery-item{border-radius:14px;overflow:hidden;border:1px solid rgba(212,160,67,.12);background:rgba(255,255,255,.03);transition:all 0.3s}
.gallery-item:hover{border-color:rgba(212,160,67,.25);box-shadow:0 8px 30px rgba(0,0,0,0.5)}
.gallery-item img{width:100%;height:220px;object-fit:cover;display:block}
.gallery-body{padding:0.8rem 1rem;display:flex;justify-content:space-between;align-items:center}
.gallery-body .name{font-size:0.85rem;font-weight:600;color:#f5e6d0}
.gallery-body .dl-btn{background:rgba(212,160,67,0.1);border:1px solid rgba(212,160,67,.2);color:#d4a043;padding:5px 14px;border-radius:20px;font-size:0.75rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.25s;font-family:inherit}
.gallery-body .dl-btn:hover{background:rgba(212,160,67,0.2)}
.empty-state{grid-column:1/-1;text-align:center;padding:3rem;color:#6b5a3a;font-size:1rem}
.empty-state .icon{font-size:3rem;margin-bottom:1rem}
.footer{text-align:center;margin-top:3rem;font-size:0.8rem;color:#6b5a3a}
.footer a{color:#b8945a;text-decoration:none}
.footer a:hover{color:#d4a043}
@media(max-width:500px){.header h1{font-size:2rem}}
</style>
</head>
<body>
<div class="container">
  <div class="lang-bar">
    <button class="lang-btn" id="langToggle">FA</button>
  </div>
  <div class="header">
    <a class="back" href="/miniprojects/" data-i18n="back">&larr; Back to Mini Projects</a>
    <h1 data-i18n="heading">Muharam</h1>
    <p data-i18n="subtitle">Muharam-related images and resources</p>
  </div>
  <div class="gallery" id="gallery">
    <div class="empty-state"><div class="icon">🕊️</div><p data-i18n="loading">Loading images...</p></div>
  </div>
  <div class="footer"><a href="/">&copy; Dawood WaliZada</a></div>
</div>
<script>
const TRANSLATIONS={en:{title:"Muharam — Dawood WaliZada",desc:"Muharam-related images and resources by Dawood WaliZada.",back:"← Back to Mini Projects",heading:"Muharam",subtitle:"Muharam-related images and resources",loading:"Loading images...",empty:"No images yet.",dl:"Download"},fa:{title:"محرم — داود ولی‌زاده",desc:"تصاویر و منابع مرتبط با محرم توسط داود ولی‌زاده.",back:"→ بازگشت به پروژه‌های کوچک",heading:"محرم",subtitle:"تصاویر و منابع مرتبط با محرم",loading:"در حال بارگذاری...",empty:"هنوز تصویری وجود ندارد.",dl:"دانلود"}};
let lang=localStorage.getItem('dlz_lang')||'en';
function applyLang(l){lang=l;localStorage.setItem('dlz_lang',l);document.documentElement.lang=l==='fa'?'fa':'en';document.documentElement.dir=l==='fa'?'rtl':'ltr';document.getElementById('langToggle').textContent=l==='fa'?'EN':'FA';document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.getAttribute('data-i18n');const t=TRANSLATIONS[l]||TRANSLATIONS.en;if(t[key]!==undefined){if(el.tagName==='META'&&el.getAttribute('content')!==null){el.setAttribute('content',t[key])}else{el.textContent=t[key]}}})}
document.getElementById('langToggle').addEventListener('click',()=>applyLang(lang==='en'?'fa':'en'));
applyLang(lang);
async function loadGallery(){try{const r=await fetch('manifest.json?t='+Date.now());if(!r.ok)throw Error();const d=await r.json();render(d.images||[])}catch{document.getElementById('gallery').innerHTML='<div class="empty-state"><div class="icon">🕊️</div><p>Failed to load.</p></div>'}}
function render(imgs){const g=document.getElementById('gallery');if(!imgs.length){g.innerHTML='<div class="empty-state"><div class="icon">🕊️</div><p data-i18n="empty">No images yet.</p></div>';document.querySelector('[data-i18n="empty"]')&&(document.querySelector('[data-i18n="empty"]').textContent=(TRANSLATIONS[lang]||TRANSLATIONS.en).empty);return}
const t=TRANSLATIONS[lang]||TRANSLATIONS.en;g.innerHTML=imgs.map(i=>`<div class="gallery-item"><img src="${i.url}?t=${Date.now()}" alt="${i.name}" loading="lazy"/><div class="gallery-body"><span class="name">${escapeHtml(i.name)}</span><a class="dl-btn" href="${i.url}" download="${i.name}">⬇ ${t.dl}</a></div></div>`).join('')}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
loadGallery();
</script>
</body>
</html>
