<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLZLAB Timing — Time Management</title>
<meta name="description" content="DLZLAB Timing — plan your schedule, tasks, habits and goals. Your entire day at a glance.">
<meta name="theme-color" content="#070b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DLZ Timing">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="pwa/icon-192.png">
<link rel="manifest" href="pwa/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/calendar.css">
<link rel="stylesheet" href="css/habits.css">
<link rel="stylesheet" href="css/schedule.css">
<link rel="stylesheet" href="css/timetable.css">
<link rel="stylesheet" href="css/goals.css">
<link rel="stylesheet" href="css/statistics.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/lock.css">
</head>
<body>
<div class="orbs" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-overlay"></div>
</div>

<div id="app">
  <div id="scrim"></div>
  <aside id="sidebar">
    <div class="sidebar-inner">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">DLZLAB Timing</span>
          <span class="brand-sub">Time Management</span>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="foot-score" id="sideStreak"></div>
      </div>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" data-action="open-drawer" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="topbar-title">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub"></p>
      </div>
      <div class="topbar-actions">
        <button class="search-btn" id="searchBtn" data-action="search" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="search-label">Search</span>
          <kbd>/</kbd>
        </button>
        <button class="icon-btn" id="bellBtn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="bell-dot" id="bellDot" hidden></span>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button class="avatar-btn" id="avatarBtn" data-action="settings" aria-label="Settings">
          <span>DLZ</span>
        </button>
      </div>
    </header>
    <main id="view"></main>
  </div>

  <button class="fab" id="fab" aria-label="Quick add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="fab-menu" id="fabMenu" hidden>
    <button data-action="add-task" class="fab-item">
      <span class="fab-item-ic c-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
      <span>Add Task</span>
    </button>
    <button data-action="add-habit" class="fab-item">
      <span class="fab-item-ic c-violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></span>
      <span>Add Habit</span>
    </button>
    <button data-action="add-goal" class="fab-item">
      <span class="fab-item-ic c-cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span>
      <span>Add Goal</span>
    </button>
    <button data-action="add-schedule" class="fab-item">
      <span class="fab-item-ic c-orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg></span>
      <span>Add Schedule</span>
    </button>
  </div>

  <nav id="bottomNav" class="bottom-nav" aria-label="Mobile navigation">
    <button data-action="nav-dashboard"><span class="bn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span><span>Home</span></button>
    <button data-action="nav-calendar"><span class="bn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span><span>Calendar</span></button>
    <button data-action="nav-tasks"><span class="bn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span><span>Tasks</span></button>
    <button data-action="nav-habits"><span class="bn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></span><span>Habits</span></button>
    <button data-action="nav-more"><span class="bn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></span><span>More</span></button>
  </nav>
</div>

<div id="sheetRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="moreSheet"></div>

<script src="js/utils.js"></script>
<script src="js/lock.js"></script>
<script src="js/icons.js"></script>
<script src="js/db.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/router.js"></script>
<script src="js/notifications.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/today.js"></script>
<script src="js/tasks.js"></script>
<script src="js/habits.js"></script>
<script src="js/calendar.js"></script>
<script src="js/schedule.js"></script>
<script src="js/timetable.js"></script>
<script src="js/goals.js"></script>
<script src="js/statistics.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
