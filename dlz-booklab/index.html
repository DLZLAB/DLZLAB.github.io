<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title data-i18n="title">DLZ BookLab — Book Summaries</title>
<meta name="description" data-i18n="desc" content="Book summaries shared by DLZ BookLab members" />
<meta name="robots" content="index, follow" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="stylesheet" href="../css/dlz-booklab.css" />
</head>
<body>
<div id="theme-wrapper" class="theme-wine">

<header class="site-header">
  <nav class="nav container">
    <a class="brand" href="/">
      <img src="../images/logo.svg" alt="DLZ" class="logo-svg" width="80" height="28" />
    </a>
    <ul class="nav-links">
      <li><a href="/" data-i18n="back">← Back to Home</a></li>
      <li>
        <button id="langToggle" class="lang-btn" aria-label="Switch language">
          <span class="lang-icon">FA</span>
        </button>
      </li>
      <li>
        <button id="themeToggle" class="lang-btn" aria-label="Switch theme" title="Theme">🎨</button>
      </li>
    </ul>
  </nav>
</header>

<main class="page">
  <div class="container">
    <div class="page-header">
      <h1><i class="fas fa-book-open"></i> <span data-i18n="heading">DLZ BookLab</span></h1>
      <p data-i18n="sub">Book summaries shared by DLZ BookLab members</p>
    </div>

    <div id="bookList">
      <div class="empty-state">
        <i class="fas fa-book"></i>
        <p data-i18n="loading">Loading...</p>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    &copy; <span id="year"></span> DLZ BookLab
  </div>
</footer>

<script>
const T={en:{title:"DLZ BookLab — Book Summaries",desc:"Book summaries shared by DLZ BookLab members",back:"← Back to Home",heading:"DLZ BookLab",sub:"Book summaries shared by DLZ BookLab members",loading:"Loading...",empty:"No book summaries yet. Check back soon!",by:"by",translator:"Translator",summarizer:"Summarized by",unknown:"Unknown",date:"Summarized",book:"Book"},fa:{title:"DLZ BookLab — خلاصه کتاب‌ها",desc:"خلاصه کتاب‌های به اشتراک گذاشته شده توسط اعضای DLZ BookLab",back:"→ بازگشت به خانه",heading:"DLZ BookLab",sub:"خلاصه کتاب‌هایی که توسط اعضای DLZ BookLab به اشتراک گذاشته شده",loading:"در حال بارگذاری...",empty:"هنوز خلاصه کتابی وجود ندارد. به زودی!",by:"نوشته",translator:"مترجم",summarizer:"خلاصه شده توسط",unknown:"نامشخص",date:"تاریخ خلاصه",book:"کتاب"}}

let lang=localStorage.getItem('dlz-lang')||'en'

document.addEventListener('DOMContentLoaded',()=>{
  applyLang(lang)
  document.getElementById('langToggle')?.addEventListener('click',()=>{
    lang=lang==='en'?'fa':'en'
    localStorage.setItem('dlz-lang',lang)
    applyLang(lang)
  })
  loadBooks()
  document.getElementById('year').textContent=new Date().getFullYear()
})

function applyLang(l){
  const t=T[l]
  if(!t)return
  document.documentElement.lang=l==='fa'?'fa':'en'
  document.documentElement.dir=l==='fa'?'rtl':'ltr'
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.dataset.i18n
    if(t[k]){if(el.tagName==='META'&&el.hasAttribute('content'))el.setAttribute('content',t[k]);else el.innerHTML=t[k]}
  })
  const btn=document.getElementById('langToggle')
  if(btn)btn.innerHTML=`<span class="lang-icon">${l==='fa'?'EN':'FA'}</span>`
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

async function loadBooks(){
  try{
    const r=await fetch('data.json')
    const d=await r.json()
    const books=(d.books||[]).sort((a,b)=>(b.id||0)-(a.id||0))
    renderBooks(books)
  }catch(e){
    document.getElementById('bookList').innerHTML=`<div class="empty-state"><i class="fas fa-book"></i><p data-i18n="empty">${T[lang].empty}</p></div>`
  }
}

function renderBooks(books){
  const container=document.getElementById('bookList')
  if(!books.length){
    container.innerHTML=`<div class="empty-state"><i class="fas fa-book"></i><p data-i18n="empty">${T[lang].empty}</p></div>`
    return
  }
  container.innerHTML=books.map((b,i)=>`
    <div class="book-item" data-id="${b.id||i}">
      <div class="book-header" onclick="toggleBook(this)">
        <div class="book-icon"><i class="fas fa-book"></i></div>
        <div class="book-info">
          <h3>${esc(b.title)}</h3>
          <div class="book-meta">
            <span><i class="fas fa-user-pen"></i> ${esc(b.author||'—')}</span>
            ${b.translator?`<span><i class="fas fa-language"></i> ${esc(b.translator)}</span>`:''}
            <span><i class="fas fa-user-graduate"></i> ${esc(b.summarizer||'—')}</span>
          </div>
        </div>
      </div>
      <div class="book-body">
        <div class="book-body-inner">
          <div class="book-summary">
            <h4><i class="fas fa-feather"></i> <span>${T[lang].book} ${esc(b.title)}</span></h4>
            <div class="summary-text">${esc(b.summary)}</div>
          </div>
          <div class="book-footer">
            <span><i class="fas fa-calendar"></i> ${T[lang].date}: ${esc(b.date||'—')}</span>
          </div>
        </div>
      </div>
    </div>
  `).join('')
}

function toggleBook(header){
  const item=header.closest('.book-item')
  const wasActive=item.classList.contains('active')
  document.querySelectorAll('.book-item.active').forEach(el=>el.classList.remove('active'))
  if(!wasActive)item.classList.add('active')
}
</script>

<script>
(function(){var w=document.getElementById('theme-wrapper'),s=localStorage.getItem('dlz-theme');if(s==='blue'&&w){w.classList.add('theme-blue')}var t=document.getElementById('themeToggle');if(t){t.addEventListener('click',function(){var b=w.classList.contains('theme-blue');w.classList.remove('theme-wine','theme-blue');w.classList.add(b?'theme-wine':'theme-blue');localStorage.setItem('dlz-theme',b?'wine':'blue')})}})();
</script>
</div>
</body>
</html>
