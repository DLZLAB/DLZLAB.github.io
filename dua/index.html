<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعاهای اسلامی | DLZLAB</title>
<meta name="description" content="مجموعه دعاهای اسلامی با ترجمه فارسی و انگلیسی — دعای دسترخوان، ختم مجلس، و ختم برنامه">
<meta property="og:title" content="دعاهای اسلامی | DLZLAB">
<meta property="og:description" content="مجموعه دعاهای اسلامی با اعراب کامل، ترجمه فارسی و انگلیسی">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg1: #0d0407;
    --glass-bg: rgba(60, 15, 28, 0.35);
    --glass-border: rgba(212, 160, 67, 0.2);
    --glass-hover: rgba(120, 30, 55, 0.25);
    --accent-green: #d4a043;
    --accent-purple: #e8c47a;
    --accent-gold: #fbbf24;
    --text-primary: #f5e6d0;
    --text-secondary: #d4af7a;
    --text-muted: #b8945a;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg1);
    color: var(--text-primary);
    font-family: 'Tajawal', 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.10; animation: drift 20s ease-in-out infinite alternate; }
  .orb-1 { width: 500px; height: 500px; background: #6b1d2f; top: -150px; right: -100px; animation-duration: 22s; }
  .orb-2 { width: 400px; height: 400px; background: #d4a043; bottom: 10%; left: -100px; animation-duration: 18s; animation-delay: -7s; }
  .orb-3 { width: 300px; height: 300px; background: #8a2740; top: 40%; right: 15%; animation-duration: 25s; animation-delay: -12s; }
  @keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px,60px) scale(1.1); } }

  .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 1.25rem; }

  header { position: relative; z-index: 1; text-align: center; padding: 4rem 1.25rem 3rem; }
  .header-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(212, 160, 67, 0.08); border: 1px solid rgba(212, 160, 67, 0.15);
    border-radius: 100px; padding: 6px 16px; font-size: 12px; color: var(--text-muted);
    letter-spacing: 0.08em; margin-bottom: 1.5rem; backdrop-filter: blur(10px);
  }
  .header-badge span { color: var(--accent-green); font-weight: 500; }
  .header-title {
    font-family: 'Noto Naskh Arabic', serif;
    font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 700; line-height: 1.3; margin-bottom: 0.75rem;
    background: linear-gradient(135deg, #f5e6d0 30%, #d4a043 70%, #e8c47a 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .header-sub { font-size: 14px; color: var(--text-muted); letter-spacing: 0.05em; margin-bottom: 2rem; }

  .nav-wrap {
    position: sticky; top: 0; z-index: 10; padding: 0.75rem 1.25rem;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    background: rgba(13, 4, 7, 0.7);
    border-bottom: 1px solid rgba(212, 160, 67, 0.1);
  }
  .nav-tabs { display: flex; gap: 6px; justify-content: center; max-width: 900px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tab {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 100px; font-size: 13px;
    font-family: 'Tajawal', sans-serif; font-weight: 500; cursor: pointer;
    border: 1px solid transparent; background: transparent; color: var(--text-muted);
    transition: all 0.2s; white-space: nowrap;
  }
  .nav-tab:hover { color: var(--text-secondary); background: var(--glass-bg); }
  .nav-tab.active { background: var(--glass-bg); border-color: var(--glass-border); color: var(--text-primary); }
  .nav-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .section { padding: 2.5rem 0; }
  .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
  .section-icon {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
    background: rgba(212, 160, 67, 0.12); border: 1px solid rgba(212, 160, 67, 0.25);
  }
  .section-title-wrap { flex: 1; }
  .section-title { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 2px; }
  .section-subtitle { font-size: 12px; color: var(--text-muted); }

  .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 620px) { .cards-grid { grid-template-columns: 1fr; } }

  .dua-card {
    background: rgba(60, 15, 28, 0.3); border: 1px solid rgba(212, 160, 67, 0.15);
    border-radius: 20px; padding: 1.25rem; backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px); transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    position: relative; overflow: hidden;
  }
  .dua-card::before {
    content: ''; position: absolute; inset: 0; border-radius: 20px;
    background: linear-gradient(135deg, rgba(212, 160, 67, 0.06) 0%, rgba(212, 160, 67, 0) 60%);
    pointer-events: none;
  }
  .dua-card:hover { transform: translateY(-3px); border-color: rgba(212, 160, 67, 0.25); background: rgba(60, 15, 28, 0.45); }

  .card-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 100px; font-size: 11px;
    font-weight: 600; letter-spacing: 0.04em; margin-bottom: 1rem; border: 1px solid;
  }
  .badge-short { color: #d4a043; border-color: rgba(212, 160, 67, 0.3); background: rgba(212, 160, 67, 0.08); }
  .badge-long  { color: #e8c47a; border-color: rgba(232, 196, 122, 0.3); background: rgba(232, 196, 122, 0.08); }

  .card-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.75rem; }

  .arabic-block {
    font-family: 'Noto Naskh Arabic', serif; font-size: 20px; font-weight: 500;
    line-height: 2.2; text-align: right; direction: rtl; color: var(--text-primary);
    padding: 0.85rem 1rem; border-radius: 12px; background: rgba(255,255,255,0.04);
    border-right: 2px solid; margin-bottom: 1rem; user-select: text; cursor: text;
  }

  .trans-toggle {
    display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-muted);
    cursor: pointer; padding: 6px 0; border: none; background: none;
    font-family: 'Tajawal', sans-serif; transition: color 0.15s; width: 100%;
    text-align: right; justify-content: flex-end;
  }
  .trans-toggle:hover { color: var(--text-secondary); }
  .trans-toggle svg { transition: transform 0.2s; flex-shrink: 0; }
  .trans-toggle.open svg { transform: rotate(180deg); }
  .trans-body { display: none; margin-top: 0.6rem; }
  .trans-body.open { display: block; }

  .trans-item {
    padding: 0.6rem 0.75rem; border-radius: 10px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 0.5rem; position: relative;
  }
  .trans-lang {
    font-size: 10px; font-weight: 600; letter-spacing: 0.07em; color: var(--text-muted);
    text-transform: uppercase; margin-bottom: 5px;
  }
  .trans-text { font-size: 13px; line-height: 1.7; color: var(--text-secondary); user-select: text; cursor: text; padding-left: 28px; }
  .trans-text.rtl { direction: rtl; text-align: right; font-family: 'Tajawal', sans-serif; font-size: 14px; padding-left: 0; padding-right: 28px; }

  .copy-btn {
    position: absolute; top: 1rem; left: 1rem;
    width: 30px; height: 30px; border-radius: 8px;
    background: rgba(212, 160, 67, 0.08); border: 1px solid rgba(212, 160, 67, 0.15);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; color: var(--text-muted);
  }
  .copy-btn:hover { background: rgba(212, 160, 67, 0.15); color: var(--text-secondary); }
  .copy-btn.copied { color: var(--accent-green); border-color: rgba(212, 160, 67, 0.4); }
  .copy-btn svg { width: 13px; height: 13px; }

  .copy-trans-btn {
    position: absolute; top: 0.5rem; left: 0.5rem;
    width: 24px; height: 24px; border-radius: 6px;
    background: rgba(212, 160, 67, 0.06); border: 1px solid rgba(212, 160, 67, 0.1);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; color: var(--text-muted);
  }
  .copy-trans-btn:hover { background: rgba(212, 160, 67, 0.12); color: var(--text-secondary); }
  .copy-trans-btn.copied { color: var(--accent-green); border-color: rgba(212, 160, 67, 0.4); }
  .copy-trans-btn svg { width: 11px; height: 11px; }

  .section-divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(212, 160, 67, 0.12), transparent); margin: 0 1.25rem; }

  .section-title-link {
    color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  }
  .section-title-link:hover { opacity: 0.85; }
  .section-title-link .anchor-icon { opacity: 0; transition: opacity 0.15s; font-size: 14px; color: var(--text-muted); }
  .section-title-link:hover .anchor-icon { opacity: 1; }

  footer { position: relative; z-index: 1; text-align: center; padding: 2.5rem 1.25rem; border-top: 1px solid rgba(212, 160, 67, 0.1); margin-top: 2rem; }
  .footer-logo { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: var(--text-muted); margin-bottom: 0.4rem; }
  .footer-logo span { color: var(--accent-green); }
  .footer-note { font-size: 12px; color: var(--text-muted); opacity: 0.7; }
  .footer-note a { color: var(--accent-green); text-decoration: none; }

  .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .orb, .reveal, .dua-card { animation: none !important; transition: none !important; } .reveal { opacity: 1; transform: none; } }

  .back-link { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--text-muted); font-size: 0.85rem; text-decoration: none; margin-bottom: 1rem; position: relative; z-index: 1; justify-content: center; }
  .back-link:hover { color: var(--accent-green); }
.theme-blue body,.theme-blue{background:#080c1a!important;color:#f0f4ff!important}
.theme-blue .theme-blue{--bg1:#080c1a!important;--glass-bg:rgba(79,70,229,0.15)!important;--glass-border:rgba(14,165,233,0.35)!important;--text-primary:#f0f4ff!important;--text-secondary:#7dd3fc!important;--text-muted:#64748b!important;--accent-green:#0ea5e9!important;--accent-purple:#06b6d4!important;--accent-gold:#4f46e5!important}
.theme-blue .lang-btn{background:rgba(79,70,229,0.08)!important;border-color:rgba(14,165,233,0.2)!important;color:#7dd3fc!important}
.theme-blue .lang-btn:hover{background:rgba(79,70,229,0.15)!important;color:#06b6d4!important}
.theme-blue .dua-card{background:rgba(79,70,229,0.12)!important;border-color:rgba(14,165,233,0.2)!important}
.theme-blue .dua-card:hover{border-color:rgba(14,165,233,0.35)!important}
.theme-blue .arabic{color:#f0f4ff!important}
.theme-blue .translation,.theme-blue .transliteration{color:#c7d2fe!important}
.theme-blue h1,.theme-blue h2{color:#0ea5e9!important}
.theme-blue .subtitle{color:#64748b!important}
.theme-blue .nav-wrap{background:rgba(8,12,26,0.85)!important;border-color:rgba(14,165,233,0.2)!important}
.theme-blue .nav-wrap a{color:#7dd3fc!important}
.theme-blue .nav-wrap a:hover{color:#06b6d4!important}
.theme-blue .badge{background:rgba(79,70,229,0.15)!important;border-color:rgba(14,165,233,0.25)!important;color:#7dd3fc!important}
.theme-blue footer,.theme-blue .footer{color:#64748b!important}
</style>
</head>
<body>
<div id="theme-wrapper" class="theme-wine">

<div class="bg-orbs" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<a class="back-link" href="/" style="display:inline-flex;margin-top:1.5rem;margin-left:auto;margin-right:auto;width:fit-content"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg> بازگشت</a>

<header>
  <div class="header-badge">
    <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
    گردآوری <span>DLZLAB</span>
  </div>
  <h1 class="header-title">مجموعه دعاهای اسلامی</h1>
  <p class="header-sub">Islamic Supplications · دعاهای روزانه با اعراب کامل و ترجمه</p>
</header>

<nav class="nav-wrap" aria-label="بخش‌های صفحه" id="navWrap">
  <div class="nav-tabs" id="navTabs"></div>
  <div style="display:flex;justify-content:center;gap:6px;margin-top:6px">
    <button id="themeToggle" class="lang-btn" style="margin-right:8px">🎨</button>
  </div>
</nav>

<div class="container" id="sectionsContainer"></div>

<footer>
  <div class="footer-logo">DLZ<span>LAB</span></div>
  <div class="footer-note">گردآوری و طراحی · compiled with care · <a href="https://dlzlab.com">dlzlab.com</a></div>
</footer>

<script>
let data = null;

async function loadData() {
  try {
    const r = await fetch('data.json');
    data = await r.json();
    render();
  } catch(e) {
    document.getElementById('sectionsContainer').innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:4rem">Failed to load duas.</p>';
  }
}

function render() {
  const navTabs = document.getElementById('navTabs');
  const container = document.getElementById('sectionsContainer');

  navTabs.innerHTML = data.sections.map(s => `
    <button class="nav-tab${s === data.sections[0] ? ' active' : ''}" onclick="scrollToSection('${s.id}')" data-section="${s.id}">
      <span class="nav-dot" style="background:${s.color}"></span>${s.title}
    </button>
  `).join('');

  container.innerHTML = data.sections.map((s, si) => `
    <section class="section reveal" id="${s.id}">
      <div class="section-header">
        <div class="section-icon">${s.icon}</div>
        <div class="section-title-wrap">
          <div class="section-title" style="color:${s.color}">
            <a class="section-title-link" href="#${s.id}">${s.title} <span class="anchor-icon">#</span></a>
          </div>
          <div class="section-subtitle">${s.subtitle}</div>
        </div>
      </div>
      <div class="cards-grid">
        ${s.duas.map(d => `
          <div class="dua-card">
            <button class="copy-btn" onclick="copyText(this,'${escAttr(d.arabic)}')" title="کپی متن عربی">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
            </button>
            <div class="card-badge ${d.type === 'short' ? 'badge-short' : 'badge-long'}">${d.type === 'short' ? 'کوتاه' : 'مفصّل'}</div>
            <div class="card-title">${escHtml(d.title)}</div>
            <div class="arabic-block" style="border-right-color:${s.color};${d.type === 'long' ? 'font-size:17px;' : ''}">${d.arabic}</div>
            <button class="trans-toggle" onclick="toggleTrans(this)">ترجمه <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg></button>
            <div class="trans-body">
              ${d.translations.map(t => `
                <div class="trans-item">
                  <button class="copy-trans-btn" onclick="copyText(this,'${escAttr(t.text)}')" title="${t.lang === 'fa' ? 'کپی' : 'Copy'}"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg></button>
                  <div class="trans-lang">${t.lang === 'fa' ? 'فارسی' : 'English'}</div>
                  <div class="trans-text${t.lang === 'fa' ? ' rtl' : ''}">${escHtml(t.text)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </section>
    ${si < data.sections.length - 1 ? '<div class="section-divider"></div>' : ''}
  `).join('');

  // Observer for active nav tab
  const sections = data.sections.map(s => s.id);
  const navTabEls = document.querySelectorAll('.nav-tab');
  const secObserver = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        navTabEls.forEach(t => t.classList.remove('active'));
        const m = document.querySelector('[data-section="' + e.target.id + '"]');
        if (m) m.classList.add('active');
      }
    });
  }, { threshold: 0.35 });
  sections.forEach(id => { const el = document.getElementById(id); if (el) secObserver.observe(el); });

  // Reveal observer
  const revEls = document.querySelectorAll('.reveal');
  const revObs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); revObs.unobserve(e.target); } });
  }, { threshold: 0.1 });
  revEls.forEach(el => revObs.observe(el));
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    const orig = btn.innerHTML;
    btn.innerHTML = '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="13" height="13"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
  });
}

function toggleTrans(btn) {
  btn.classList.toggle('open');
  btn.nextElementSibling.classList.toggle('open');
}

function scrollToSection(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

loadData();
</script>

</div><!-- /theme-wrapper -->

<script>
(function(){var w=document.getElementById('theme-wrapper'),s=localStorage.getItem('dlz-theme');if(s==='blue'&&w){w.classList.add('theme-blue');document.body.classList.add('theme-blue')}var t=document.getElementById('themeToggle');if(t){t.addEventListener('click',function(){var b=w.classList.contains('theme-blue');w.classList.remove('theme-wine','theme-blue');w.classList.add(b?'theme-wine':'theme-blue');document.body.classList.toggle('theme-blue',!b);localStorage.setItem('dlz-theme',b?'wine':'blue')})}})();
</script>
</body>
</html>
