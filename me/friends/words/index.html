<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Friends Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:#0d0407;
  color:#f5e6d0;
  line-height:1.6;
  padding:2rem 1.5rem;
}
.container{max-width:720px;width:100%;margin:0 auto}
h1{font-size:1.8rem;font-weight:800;margin-bottom:0.3rem;background:linear-gradient(135deg,#f5e6d0,#d4a043);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.desc{color:#b8945a;font-size:0.85rem;margin-bottom:2rem}
.section{background:rgba(255,255,255,.04);border:1px solid rgba(212,160,67,.12);border-radius:14px;padding:1.5rem;margin-bottom:1.5rem}
.section h2{font-size:1rem;font-weight:700;margin-bottom:1rem;color:#d4a043}
.form-group{margin-bottom:0.8rem}
.form-group label{display:block;font-size:0.75rem;font-weight:600;color:#b8945a;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.form-group input,.form-group textarea{width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(212,160,67,.15);background:rgba(255,255,255,.05);color:#f5e6d0;font-family:inherit;font-size:0.85rem;outline:none;transition:border-color 0.25s}
.form-group input:focus,.form-group textarea:focus{border-color:#d4a043;background:rgba(212,160,67,.06)}
.form-group textarea{resize:vertical;min-height:60px}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:40px;
  font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;
  background:linear-gradient(135deg,#d4a043,#b8862b);color:#0d0407;transition:all 0.3s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,160,67,.35)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-sm{padding:6px 12px;font-size:11px}
.btn-outline{background:transparent;border:1px solid rgba(212,160,67,.25);color:#b8945a}
.btn-outline:hover{background:rgba(212,160,67,.1);color:#d4a043}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-danger:hover{box-shadow:0 6px 20px rgba(239,68,68,.35)}
.status{padding:10px 14px;border-radius:8px;font-size:0.8rem;margin-top:0.8rem;display:none}
.status.show{display:block}
.status.ok{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#10b981}
.status.err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#ef4444}
.status.info{background:rgba(129,140,248,.15);border:1px solid rgba(129,140,248,.3);color:#818cf8}
a{color:#d4a043}
small{color:#6b5a3a;font-size:0.75rem}
.quote-item{display:flex;align-items:center;gap:8px;padding:0.8rem 0;border-bottom:1px solid rgba(212,160,67,.08)}
.quote-item:last-child{border-bottom:none}
.quote-item .q-main{flex:1;min-width:0}
.quote-item .q-text{font-size:0.85rem;color:#f5e6d0;font-style:italic;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quote-item .q-name{font-size:0.75rem;color:#d4a043;font-weight:600;display:block;margin-top:2px}
.quote-item .q-actions{display:flex;gap:4px;flex-shrink:0}
.empty-msg{color:#6b5a3a;font-size:0.85rem;text-align:center;padding:1rem}
.loading-msg{color:#6b5a3a;font-size:0.85rem;text-align:center;padding:1rem}
.edit-inline{display:flex;flex-direction:column;gap:6px;width:100%}
.edit-inline .edit-row{display:flex;gap:6px;flex-wrap:wrap}
.edit-inline input,.edit-inline textarea{padding:6px 10px;border-radius:6px;border:1px solid rgba(212,160,67,.15);background:rgba(255,255,255,.08);color:#f5e6d0;font-family:inherit;font-size:0.8rem;outline:none;width:100%}
.edit-inline input:focus,.edit-inline textarea:focus{border-color:#d4a043}
.edit-inline textarea{min-height:50px;resize:vertical}
.edit-inline .edit-btns{display:flex;gap:4px;margin-top:2px}
</style>
</head>
<body>
<div class="container">
  <h1>Friends Admin</h1>
  <p class="desc">Add, edit, or delete quotes. Changes save directly to GitHub.</p>

  <div class="section">
    <h2>GitHub Token</h2>
    <div class="form-group">
      <label>Personal Access Token</label>
      <input id="tokenInput" type="password" placeholder="ghp_... or github_pat_..." />
    </div>
    <p><small>Saved in your browser only. Generate at <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a> (needs <code>repo</code> scope).</small></p>
    <button class="btn btn-sm" onclick="loadQuotes()">Load Quotes</button>
  </div>

  <div class="section">
    <h2>Add Quote</h2>
    <div class="form-group">
      <label>Name</label>
      <input id="addName" type="text" placeholder="e.g. Ahmad" maxlength="50" />
    </div>
    <div class="form-group">
      <label>Quote</label>
      <textarea id="addText" placeholder="Write the quote..." maxlength="500"></textarea>
    </div>
    <button class="btn" onclick="addAndCommit()">Add & Publish</button>
    <div class="status" id="status"></div>
  </div>

  <div class="section">
    <h2>Current Quotes (<span id="quoteCount">0</span>)</h2>
    <div id="quoteList"><p class="loading-msg">Enter token and click Load Quotes</p></div>
  </div>
</div>

<script>
const OWNER = 'DLZLAB';
const REPO = 'DLZLAB.github.io';
const PATH = 'friends/quotes.json';
const BRANCH = 'master';

let quotes = [];
let sha = null;
let editingIndex = -1;

const tokenInput = document.getElementById('tokenInput');
const statusEl = document.getElementById('status');

tokenInput.value = localStorage.getItem('gh_token') || '';
tokenInput.addEventListener('input', () => {
  localStorage.setItem('gh_token', tokenInput.value);
});

function setStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = 'status show ' + type;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function loadQuotes() {
  const token = tokenInput.value.trim();
  if (!token) { setStatus('Enter your GitHub token first.', 'err'); return; }
  setStatus('Loading quotes...', 'info');
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.message); }
    const data = await res.json();
    sha = data.sha;
    quotes = JSON.parse(atob(data.content.replace(/\n/g, ''))).quotes || [];
    renderQuotes();
    setStatus('Loaded ' + quotes.length + ' quotes.', 'ok');
  } catch (e) {
    setStatus('Error: ' + e.message, 'err');
  }
}

function renderQuotes() {
  const list = document.getElementById('quoteList');
  const count = document.getElementById('quoteCount');
  count.textContent = quotes.length;
  if (!quotes.length) {
    list.innerHTML = '<p class="empty-msg">No quotes yet.</p>';
    return;
  }
  list.innerHTML = quotes.map((q, i) => {
    if (editingIndex === i) return renderEditRow(q, i);
    return `
      <div class="quote-item">
        <div class="q-main">
          <span class="q-text">"${escapeHtml(q.text)}"</span>
          <span class="q-name">— ${escapeHtml(q.name)}</span>
        </div>
        <div class="q-actions">
          <button class="btn btn-sm btn-outline" onclick="startEdit(${i})">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteQuote(${i})">Del</button>
        </div>
      </div>
    `;
  }).join('');
}

function renderEditRow(q, i) {
  return `
    <div class="quote-item">
      <div class="edit-inline">
        <input id="editName${i}" value="${escapeHtml(q.name)}" placeholder="Name" maxlength="50" />
        <textarea id="editText${i}" placeholder="Quote" maxlength="500">${escapeHtml(q.text)}</textarea>
        <div class="edit-btns">
          <button class="btn btn-sm" onclick="saveEdit(${i})">Save</button>
          <button class="btn btn-sm btn-outline" onclick="cancelEdit()">Cancel</button>
        </div>
      </div>
    </div>
  `;
}

function startEdit(i) {
  editingIndex = i;
  renderQuotes();
}

function cancelEdit() {
  editingIndex = -1;
  renderQuotes();
}

async function saveEdit(i) {
  const name = document.getElementById('editName' + i).value.trim();
  const text = document.getElementById('editText' + i).value.trim();
  if (!name || !text) { setStatus('Name and quote cannot be empty.', 'err'); return; }
  quotes[i] = { name, text };
  editingIndex = -1;
  await commitQuotes('Edit quote from ' + name);
}

async function deleteQuote(i) {
  if (!confirm('Delete this quote?')) return;
  const name = quotes[i].name;
  quotes.splice(i, 1);
  if (editingIndex === i) editingIndex = -1;
  else if (editingIndex > i) editingIndex--;
  await commitQuotes('Delete quote from ' + name);
}

async function addAndCommit() {
  const token = tokenInput.value.trim();
  const name = document.getElementById('addName').value.trim();
  const text = document.getElementById('addText').value.trim();
  if (!token) { setStatus('Enter your GitHub token first.', 'err'); return; }
  if (!name || !text) { setStatus('Enter both name and quote.', 'err'); return; }

  setStatus('Adding quote...', 'info');
  try {
    if (!sha) {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
        headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (!res.ok) { const e = await res.json(); throw new Error(e.message); }
      const data = await res.json();
      sha = data.sha;
      quotes = JSON.parse(atob(data.content.replace(/\n/g, ''))).quotes || [];
    }
    quotes.push({ name, text });
    await commitQuotes('Add quote from ' + name);
    document.getElementById('addName').value = '';
    document.getElementById('addText').value = '';
  } catch (e) {
    setStatus('Error: ' + e.message, 'err');
  }
}

async function commitQuotes(msg) {
  const token = tokenInput.value.trim();
  try {
    const newContent = btoa(unescape(encodeURIComponent(JSON.stringify({ quotes }, null, 2) + '\n')));
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
      body: JSON.stringify({ message: msg, content: newContent, sha: sha, branch: BRANCH })
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.message); }
    const data = await res.json();
    sha = data.content.sha;
    renderQuotes();
    setStatus('Saved! Live at /friends/', 'ok');
  } catch (e) {
    setStatus('Error: ' + e.message, 'err');
  }
}
</script>
</body>
</html>
