<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DLZ BookLab Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Vazirmatn',system-ui,sans-serif;background:#0d0407;color:#f5e6d0;line-height:1.6;padding:2rem 1.5rem}
.container{max-width:800px;width:100%;margin:0 auto}
h1{font-size:1.8rem;font-weight:800;margin-bottom:0.3rem;background:linear-gradient(135deg,#f5e6d0,#d4a043);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.desc{color:#b8945a;font-size:0.85rem;margin-bottom:2rem}
.section{background:rgba(255,255,255,.04);border:1px solid rgba(212,160,67,.12);border-radius:14px;padding:1.5rem;margin-bottom:1.5rem}
.section h2{font-size:1rem;font-weight:700;margin-bottom:1rem;color:#d4a043}
.form-group{margin-bottom:0.8rem}
.form-group label{display:block;font-size:0.75rem;font-weight:600;color:#b8945a;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.form-group input,.form-group textarea{width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(212,160,67,.15);background:rgba(255,255,255,.05);color:#f5e6d0;font-family:inherit;font-size:0.85rem;outline:none;transition:border-color 0.25s}
.form-group input:focus,.form-group textarea:focus{border-color:#d4a043;background:rgba(212,160,67,.06)}
.form-group textarea{resize:vertical;min-height:120px}
.form-row{display:flex;gap:0.8rem}
.form-row .form-group{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:40px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;background:linear-gradient(135deg,#d4a043,#b8862b);color:#0d0407;transition:all 0.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,160,67,.35)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-sm{padding:6px 14px;font-size:11px}
.btn-outline{background:transparent;border:1px solid rgba(212,160,67,.25);color:#b8945a}
.btn-outline:hover{background:rgba(212,160,67,.1);color:#d4a043}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-danger:hover{box-shadow:0 6px 20px rgba(239,68,68,.35)}
.status{padding:10px 14px;border-radius:8px;font-size:0.8rem;margin-top:0.8rem;display:none}
.status.show{display:block}
.status.ok{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#10b981}
.status.err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#ef4444}
.status.info{background:rgba(129,140,248,.15);border:1px solid rgba(129,140,248,.3);color:#818cf8}
a{color:#d4a043}
small{color:#6b5a3a;font-size:0.75rem}
.book-item{display:flex;align-items:center;gap:8px;padding:0.8rem 0;border-bottom:1px solid rgba(212,160,67,.08)}
.book-item:last-child{border-bottom:none}
.book-item .b-main{flex:1;min-width:0}
.book-item .b-title{font-size:0.85rem;color:#f5e6d0;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book-item .b-meta{font-size:0.75rem;color:#b8945a;display:block;margin-top:2px}
.book-item .b-actions{display:flex;gap:4px;flex-shrink:0}
.empty-msg{color:#6b5a3a;font-size:0.85rem;text-align:center;padding:1rem}
.loading-msg{color:#6b5a3a;font-size:0.85rem;text-align:center;padding:1rem}
</style>
</head>
<body>
<div class="container">
  <h1><i class="fas fa-book-open"></i> DLZ BookLab Admin</h1>
  <p class="desc">Add and manage book summaries. Data commits directly to GitHub.</p>

  <div class="section">
    <h2>GitHub Token</h2>
    <div class="form-group">
      <label>Personal Access Token</label>
      <input id="tokenInput" type="password" placeholder="ghp_... or github_pat_..." />
    </div>
    <p><small>Saved in your browser. Generate at <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a> (needs <code>repo</code> scope).</small></p>
    <button class="btn btn-sm" onclick="loadBooks()">Load Books</button>
  </div>

  <div class="section">
    <h2>Add Book Summary</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Book Name *</label>
        <input id="bookTitle" type="text" placeholder="e.g. The Alchemist" maxlength="200" />
      </div>
      <div class="form-group">
        <label>Author *</label>
        <input id="bookAuthor" type="text" placeholder="e.g. Paulo Coelho" maxlength="200" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Translator (مترجم)</label>
        <input id="bookTranslator" type="text" placeholder="e.g. احمد کمال" maxlength="200" />
      </div>
      <div class="form-group">
        <label>Summarized by (خلاصه کننده) *</label>
        <input id="bookSummarizer" type="text" placeholder="e.g. Dawood WaliZada" maxlength="200" />
      </div>
    </div>
    <div class="form-group">
      <label>Date Summarized (تاریخ خلاصه)</label>
      <input id="bookDate" type="text" placeholder="e.g. 1403-01-15 or 2026-06-20" maxlength="50" />
    </div>
    <div class="form-group">
      <label>Summary / خلاصه کتاب *</label>
      <textarea id="bookSummary" placeholder="Write the book summary here..."></textarea>
    </div>
    <button class="btn" onclick="addBook()">Add & Publish</button>
    <div class="status" id="status"></div>
  </div>

  <div class="section">
    <h2>Current Books (<span id="bookCount">0</span>)</h2>
    <div id="bookList"><p class="loading-msg">Enter token and click Load Books</p></div>
  </div>
</div>

<script>
const OWNER = 'DLZLAB', REPO = 'DLZLAB.github.io', BRANCH = 'master';
const DATA_PATH = 'dlz-booklab/data.json';

let books = [];
let dataSha = null;

const tokenInput = document.getElementById('tokenInput');
tokenInput.value = localStorage.getItem('gh_token') || '';
tokenInput.addEventListener('input', () => localStorage.setItem('gh_token', tokenInput.value));

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status show ' + type;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function api(url, method, body) {
  const token = tokenInput.value.trim();
  const opts = { method, headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }};
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(url, opts);
  if (!res.ok) { const e = await res.json(); throw new Error(e.message); }
  return res.json();
}

async function loadBooks() {
  const token = tokenInput.value.trim();
  if (!token) { setStatus('Enter token first.', 'err'); return; }
  setStatus('Loading books...', 'info');
  try {
    const data = await api(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DATA_PATH}`);
    dataSha = data.sha;
    books = JSON.parse(atob(data.content.replace(/\n/g, ''))).books || [];
    renderBooks();
    setStatus('Loaded ' + books.length + ' books.', 'ok');
  } catch (e) {
    setStatus('Error: ' + e.message, 'err');
  }
}

function renderBooks() {
  const list = document.getElementById('bookList');
  document.getElementById('bookCount').textContent = books.length;
  if (!books.length) { list.innerHTML = '<p class="empty-msg">No books yet.</p>'; return; }
  list.innerHTML = books.map((b, i) => `
    <div class="book-item">
      <div class="b-main">
        <span class="b-title">${esc(b.title)}</span>
        <span class="b-meta">${esc(b.author)} &middot; ${esc(b.summarizer)} ${b.date ? '&middot; ' + esc(b.date) : ''}</span>
      </div>
      <div class="b-actions">
        <button class="btn btn-sm btn-danger" onclick="deleteBook(${i})">Del</button>
      </div>
    </div>
  `).join('');
}

async function addBook() {
  const token = tokenInput.value.trim();
  const title = document.getElementById('bookTitle').value.trim();
  const author = document.getElementById('bookAuthor').value.trim();
  const translator = document.getElementById('bookTranslator').value.trim();
  const summarizer = document.getElementById('bookSummarizer').value.trim();
  const date = document.getElementById('bookDate').value.trim();
  const summary = document.getElementById('bookSummary').value.trim();

  if (!token) { setStatus('Enter token first.', 'err'); return; }
  if (!title) { setStatus('Enter the book name.', 'err'); return; }
  if (!author) { setStatus('Enter the author name.', 'err'); return; }
  if (!summarizer) { setStatus('Enter who summarized the book.', 'err'); return; }
  if (!summary) { setStatus('Enter the book summary.', 'err'); return; }

  setStatus('Saving...', 'info');
  try {
    if (!dataSha) {
      const data = await api(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DATA_PATH}`);
      dataSha = data.sha;
      books = JSON.parse(atob(data.content.replace(/\n/g, ''))).books || [];
    }

    const newId = books.length ? Math.max(...books.map(b => b.id)) + 1 : 1;
    books.push({ id: newId, title, author, translator: translator || '', summarizer, date: date || '', summary, date_added: new Date().toISOString().split('T')[0] });
    books.sort((a, b) => b.id - a.id);

    const content = btoa(unescape(encodeURIComponent(JSON.stringify({ books }, null, 2) + '\n')));
    const upData = await api(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DATA_PATH}`, 'PUT', {
      message: 'Add book summary: ' + title,
      content, sha: dataSha, branch: BRANCH
    });
    dataSha = upData.content.sha;

    renderBooks();
    setStatus('Published! Visit /dlz-booklab/ to see it.', 'ok');
    document.getElementById('bookTitle').value = '';
    document.getElementById('bookAuthor').value = '';
    document.getElementById('bookTranslator').value = '';
    document.getElementById('bookSummarizer').value = '';
    document.getElementById('bookDate').value = '';
    document.getElementById('bookSummary').value = '';
  } catch (e) {
    setStatus('Error: ' + e.message, 'err');
  }
}

async function deleteBook(index) {
  if (!confirm('Delete "' + books[index].title + '"?')) return;
  const book = books[index];
  books.splice(index, 1);
  setStatus('Saving...', 'info');
  try {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify({ books }, null, 2) + '\n')));
    const data = await api(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DATA_PATH}`, 'PUT', {
      message: 'Delete book summary: ' + book.title,
      content, sha: dataSha, branch: BRANCH
    });
    dataSha = data.content.sha;
    renderBooks();
    setStatus('Deleted.', 'ok');
  } catch (e) {
    setStatus('Error: ' + e.message, 'err');
  }
}
</script>
</body>
</html>
