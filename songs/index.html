<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title data-i18n="title">Songs — Dawood WaliZada</title>
<meta name="description" data-i18n="desc" content="Songs by Dawood WaliZada" />
<meta name="robots" content="index, follow" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="stylesheet" href="../css/songs.css" />
</head>
<body>
<div id="theme-wrapper" class="theme-wine">

<header class="site-header">
  <nav class="nav container">
    <a class="brand" href="/">
      <img src="../images/logo.svg" alt="DLZ" class="logo-svg" width="80" height="28" />
    </a>
    <ul class="nav-links">
      <li><a href="/" data-i18n="back">← Back to Home</a></li>
      <li>
        <button id="langToggle" class="lang-btn" aria-label="Switch language">
          <span class="lang-icon">FA</span>
        </button>
      </li>
      <li>
        <button id="themeToggle" class="lang-btn" aria-label="Switch theme" title="Theme">🎨</button>
      </li>
    </ul>
  </nav>
</header>

<main class="songs-page">
  <div class="container">
    <div class="page-header">
      <h1><i class="fas fa-music"></i> <span data-i18n="heading">Songs</span></h1>
      <p data-i18n="sub">Listen to songs created by Dawood WaliZada</p>
    </div>

    <div id="songList">
      <div class="empty-state">
        <i class="fas fa-music"></i>
        <p data-i18n="empty">Loading...</p>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    &copy; <span id="year"></span> Dawood WaliZada
  </div>
</footer>
</div>

<script>
document.getElementById('year').textContent=new Date().getFullYear()
</script>
<script src="../js/songs.js"></script>
<script>
(function(){var w=document.getElementById('theme-wrapper'),s=localStorage.getItem('dlz-theme');if(s==='blue'&&w){w.classList.add('theme-blue');document.body.classList.add('theme-blue')}var t=document.getElementById('themeToggle');if(t){t.addEventListener('click',function(){var b=w.classList.contains('theme-blue');w.classList.remove('theme-wine','theme-blue');w.classList.add(b?'theme-wine':'theme-blue');document.body.classList.toggle('theme-blue',!b);localStorage.setItem('dlz-theme',b?'wine':'blue')})}})();
</script>
</body>
</html>
