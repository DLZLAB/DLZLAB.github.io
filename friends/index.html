<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title data-i18n="title">Friends — Dawood WaliZada</title>
<meta name="description" data-i18n="desc" content="Words and sentences from friends — a collection of shared moments by Dawood WaliZada." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://dlzlab.com/friends/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter','Vazirmatn',system-ui,sans-serif;
  background:#0d0407;
  color:#f5e6d0;
  line-height:1.6;
  min-height:100vh;
  padding:2rem 1.5rem;
  background-image:radial-gradient(ellipse at 20% 50%, rgba(107,29,47,0.3) 0%, transparent 60%),
                   radial-gradient(ellipse at 80% 50%, rgba(212,160,67,0.08) 0%, transparent 60%);
}
.container{max-width:960px;width:100%;margin:0 auto}

/* lang toggle */
.lang-bar{
  display:flex;justify-content:flex-end;margin-bottom:1rem;
}
.lang-btn{
  background:rgba(212,160,67,0.1);
  border:1px solid rgba(212,160,67,.15);
  color:#b8945a;padding:4px 14px;border-radius:20px;
  font-size:0.75rem;font-weight:600;cursor:pointer;
  font-family:inherit;transition:all 0.25s;
  text-transform:uppercase;letter-spacing:1px;
}
.lang-btn:hover{background:rgba(212,160,67,0.2);color:#d4a043}

/* RTL */
html[dir="rtl"] body{font-family:'Vazirmatn','Inter',system-ui,sans-serif}
html[dir="rtl"] .quote-text{border-left:none;border-right:2px solid #d4a043;padding-left:0;padding-right:1.2rem}
html[dir="rtl"] .back{flex-direction:row-reverse}

/* header */
.header{text-align:center;margin-bottom:3rem}
.header .back{
  display:inline-flex;align-items:center;gap:0.4rem;
  color:#b8945a;font-size:0.85rem;text-decoration:none;
  margin-bottom:1rem;transition:color 0.2s;
}
.header .back:hover{color:#d4a043}
.header h1{
  font-size:2.8rem;font-weight:800;line-height:1.15;
  background:linear-gradient(135deg,#f5e6d0,#d4a043);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.header p{color:#b8945a;font-size:1rem;margin-top:0.5rem;max-width:600px;margin-left:auto;margin-right:auto}

/* layout: two columns */
.layout-split{
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:1.5rem;
  align-items:start;
}
html[dir="rtl"] .layout-split{direction:rtl}

/* form (left column) */
.form-col{position:sticky;top:2rem}
.form-col h2{
  font-size:1.15rem;
  font-weight:700;
  margin-bottom:0.3rem;
  color:#f5e6d0;
}
.form-col > p{
  color:#b8945a;
  font-size:0.8rem;
  margin-bottom:1rem;
}
.form-card{
  padding:1.4rem;
  border-radius:16px;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(212,160,67,.12);
}
.form-card form{display:flex;flex-direction:column;gap:0.8rem}
.form-card label{
  font-size:0.7rem;
  font-weight:600;
  color:#b8945a;
  text-transform:uppercase;
  letter-spacing:1px;
}
.form-card input,.form-card textarea{
  padding:10px 14px;
  border-radius:8px;
  border:1px solid rgba(212,160,67,.15);
  background:rgba(255,255,255,.05);
  color:#f5e6d0;
  font-family:inherit;
  font-size:0.85rem;
  outline:none;
  transition:border-color 0.25s,background 0.25s;
  width:100%;
}
.form-card input:focus,.form-card textarea:focus{
  border-color:#d4a043;
  background:rgba(212,160,67,.06);
}
.form-card textarea{resize:vertical;min-height:80px}
.form-card .btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 22px;border-radius:40px;
  font-size:13px;font-weight:600;cursor:pointer;border:none;
  background:linear-gradient(135deg,#d4a043,#b8862b);
  color:#0d0407;
  transition:all 0.3s;
  font-family:inherit;
}
.form-card .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,160,67,.35)}
.form-card .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.form-status{
  margin-top:0.3rem;
  font-size:0.8rem;
  text-align:center;
  padding:6px 10px;
  border-radius:6px;
  display:none;
}
.form-status.success{display:block;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#10b981}
.form-status.error{display:block;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#ef4444}

/* quotes (right column) */
.quotes-col{}
.quotes-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:1rem;
}
.quote-card{
  padding:1.4rem 1.2rem;
  border-radius:14px;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(212,160,67,.12);
  transition:all 0.3s ease;
}
.quote-card:hover{
  border-color:rgba(212,160,67,.25);
  box-shadow:0 8px 30px rgba(0,0,0,0.5), 0 0 20px rgba(212,160,67,0.05);
  transform:translateY(-3px);
}
.quote-text{
  font-family:'Cormorant Garamond','Georgia',serif;
  font-size:1.1rem;
  font-style:italic;
  color:#f5e6d0;
  line-height:1.5;
  margin-bottom:0.7rem;
  padding-left:1rem;
  border-left:2px solid #d4a043;
}
html[dir="rtl"] .quote-text{border-left:none;border-right:2px solid #d4a043;padding-left:0;padding-right:1rem}
.quote-author{
  font-size:0.8rem;
  font-weight:600;
  color:#d4a043;
}
.empty-state{
  text-align:center;
  padding:2rem;
  color:#6b5a3a;
  font-size:0.9rem;
}
.empty-state .icon{font-size:2.5rem;margin-bottom:0.8rem}

/* footer */
.footer{
  text-align:center;margin-top:3rem;
  font-size:0.8rem;color:#6b5a3a;
}
.footer a{color:#b8945a;text-decoration:none}
.footer a:hover{color:#d4a043}

@media(max-width:768px){
  .layout-split{grid-template-columns:1fr}
  .form-col{position:static}
  .form-col h2{text-align:center}
  .form-col > p{text-align:center}
}
@media(max-width:500px){
  .header h1{font-size:2rem}
}
</style>
</head>
<body>
<div class="container">

  <div class="lang-bar">
    <button class="lang-btn" id="langToggle">FA</button>
  </div>

  <div class="header">
    <a class="back" href="/miniprojects/" data-i18n="back">&larr; Back to Mini Projects</a>
    <h1 data-i18n="heading">Friends</h1>
    <p data-i18n="subtitle">Words and sentences from the people around me — a collection of shared moments, thoughts, and memories</p>
  </div>

  <!-- two-column layout -->
  <div class="layout-split">

    <!-- form column (left) -->
    <div class="form-col">
      <h2 data-i18n="form_heading">Leave a Word</h2>
      <p data-i18n="form_sub">Write your name and a sentence — it may appear here after review</p>
      <div class="form-card">
        <form id="friendForm">
          <div>
            <label for="name" data-i18n="form_name_label">Your Name</label>
            <input id="name" name="name" type="text" data-i18n="form_name_placeholder" placeholder="e.g. Ahmad" required minlength="2" maxlength="50" />
          </div>
          <div>
            <label for="message" data-i18n="form_msg_label">Your Message</label>
            <textarea id="message" name="message" data-i18n="form_msg_placeholder" placeholder="Write something..." required minlength="3" maxlength="500"></textarea>
          </div>
          <button type="submit" class="btn" id="submitBtn">&#x1F4AC; <span data-i18n="form_send">Send</span></button>
          <div class="form-status" id="formStatus"></div>
        </form>
      </div>
    </div>

    <!-- quotes column (right) -->
    <div class="quotes-col">
      <div class="quotes-grid" id="quotesGrid">
        <div class="empty-state" id="loadingState">
          <div class="icon">&#x1F4AC;</div>
          <p data-i18n="loading">Loading quotes...</p>
        </div>
      </div>
    </div>

  </div>

  <div class="footer">
    <a href="/">&copy; Dawood WaliZada</a>
  </div>

</div>

<script>
const TRANSLATIONS={en:{title:"Friends — Dawood WaliZada",desc:"Words and sentences from friends — a collection of shared moments by Dawood WaliZada.",back:"← Back to Mini Projects",heading:"Friends",subtitle:"Words and sentences from the people around me — a collection of shared moments, thoughts, and memories",loading:"Loading quotes...",empty:"No quotes yet. Be the first to leave a word!",form_heading:"Leave a Word",form_sub:"Write your name and a sentence — it may appear here after review",form_name_label:"Your Name",form_name_placeholder:"e.g. Ahmad",form_msg_label:"Your Message",form_msg_placeholder:"Write something...",form_send:"Send",sending:"Sending...",success:"Sent! Your message will appear after review.",error:"Something went wrong. Try again later."},fa:{title:"دوستان — داود ولی‌زاده",desc:"کلمات و جملات دوستان — مجموعه‌ای از لحظات مشترک توسط داود ولی‌زاده.",back:"→ بازگشت به پروژه‌های کوچک",heading:"دوستان",subtitle:"کلمات و جملات اطرافیانم — مجموعه‌ای از لحظات، افکار و خاطرات مشترک",loading:"در حال بارگذاری...",empty:"هنوز جمله‌ای ثبت نشده. اولین نفر باش!",form_heading:"یک جمله بنویس",form_sub:"نام و جمله‌ات را بنویس — ممکن است بعد از بررسی اینجا نمایش داده شود",form_name_label:"نام شما",form_name_placeholder:"مثلاً احمد",form_msg_label:"پیام شما",form_msg_placeholder:"چیزی بنویس...",form_send:"ارسال",sending:"در حال ارسال...",success:"ارسال شد! پیام شما بعد از بررسی نمایش داده می‌شود.",error:"مشکلی پیش آمد. بعداً دوباره تلاش کن."}};
let lang=localStorage.getItem('dlz_lang')||'en';
function applyLang(l){lang=l;localStorage.setItem('dlz_lang',l);document.documentElement.lang=l==='fa'?'fa':'en';document.documentElement.dir=l==='fa'?'rtl':'ltr';document.getElementById('langToggle').textContent=l==='fa'?'EN':'FA';document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.getAttribute('data-i18n');const t=TRANSLATIONS[l]||TRANSLATIONS.en;if(t[key]!==undefined){if(el.tagName==='META'&&el.getAttribute('content')!==null){el.setAttribute('content',t[key])}else if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'){el.setAttribute('placeholder',t[key])}else{el.textContent=t[key]}}});}
document.getElementById('langToggle').addEventListener('click',()=>applyLang(lang==='en'?'fa':'en'));
applyLang(lang);

const QUOTES_JSON='quotes.json';
const FORMSPREE_URL='https://formspree.io/f/mjgaoayk';
const grid=document.getElementById('quotesGrid');
const form=document.getElementById('friendForm');
const submitBtn=document.getElementById('submitBtn');
const formStatus=document.getElementById('formStatus');

async function loadQuotes(){try{const res=await fetch(QUOTES_JSON+'?t='+Date.now());if(!res.ok)throw new Error('Not found');const data=await res.json();renderQuotes(data.quotes||[])}catch{renderEmpty()}}
function renderEmpty(){const t=TRANSLATIONS[lang]||TRANSLATIONS.en;grid.innerHTML=`<div class="empty-state"><div class="icon">💬</div><p>${t.empty}</p></div>`}
function renderQuotes(quotes){if(!quotes.length){renderEmpty();return}grid.innerHTML=quotes.map(q=>`<div class="quote-card"><div class="quote-text">${escapeHtml(q.text)}</div><div class="quote-author">— ${escapeHtml(q.name)}</div></div>`).join('')}
function escapeHtml(str){const div=document.createElement('div');div.textContent=str;return div.innerHTML}

form.addEventListener('submit',async function(e){e.preventDefault();const t=TRANSLATIONS[lang]||TRANSLATIONS.en;submitBtn.disabled=true;submitBtn.innerHTML=t.sending;formStatus.className='form-status';const data={name:form.name.value.trim(),message:form.message.value.trim(),_subject:'[Friends] New message from '+form.name.value.trim()};try{const res=await fetch(FORMSPREE_URL,{method:'POST',body:JSON.stringify(data),headers:{'Content-Type':'application/json','Accept':'application/json'}});if(res.ok){formStatus.className='form-status success';formStatus.textContent=t.success;form.reset()}else{throw new Error('Server error')}}catch{formStatus.className='form-status error';formStatus.textContent=t.error}submitBtn.disabled=false;submitBtn.innerHTML=t.form_send});

loadQuotes();
</script>
</body>
</html>
